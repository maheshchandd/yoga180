name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web application
        run: bun run build -- --base=/yoga180/ || bun run build
        env:
          NODE_ENV: production
          BASE_URL: /yoga180/
          PUBLIC_URL: /yoga180/

      - name: Detect output folder
        id: detect
        run: |
          if [ -d "packages/web/dist" ]; then
            echo "out_dir=packages/web/dist" >> $GITHUB_OUTPUT
          elif [ -d "packages/web/build" ]; then
            echo "out_dir=packages/web/build" >> $GITHUB_OUTPUT
          elif [ -d "packages/web/out" ]; then
            echo "out_dir=packages/web/out" >> $GITHUB_OUTPUT
          elif [ -d "dist" ]; then
            echo "out_dir=dist" >> $GITHUB_OUTPUT
          elif [ -d "build" ]; then
            echo "out_dir=build" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.out_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
