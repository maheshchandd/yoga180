name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web application
        run: |
          cd packages/web
          bun run build
        env:
          NODE_ENV: production
          BASE_URL: /yoga180/
          PUBLIC_URL: /yoga180/

      - name: Detect and patch output directory for subpaths
        id: detect
        run: |
          if [ -d "packages/web/dist" ]; then
            TARGET_DIR="packages/web/dist"
          elif [ -d "packages/web/build" ]; then
            TARGET_DIR="packages/web/build"
          elif [ -d "packages/web/out" ]; then
            TARGET_DIR="packages/web/out"
          elif [ -d "dist" ]; then
            TARGET_DIR="dist"
          elif [ -d "build" ]; then
            TARGET_DIR="build"
          else
            echo "Error: Output directory not found"
            exit 1
          fi

          echo "Target directory is: $TARGET_DIR"

          # Fix absolute paths in all generated html, js, and css files
          # Replaces href="/ with href="./ and src="/ with src="./
          find "$TARGET_DIR" -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's|href="/|href="./|g' {} +
          find "$TARGET_DIR" -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's|src="/|src="./|g' {} +

          # Remove calls to the missing runable.js file so console errors stop
          find "$TARGET_DIR" -type f -name "*.html" -exec sed -i 's|<script[^>]*runable\.js[^>]*></script>||g' {} +

          echo "out_dir=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.out_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
